# Dependabot: 依存の既知脆弱性・更新を定期的に拾う (§9 サプライチェーン管理)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node の major は「動かす Node の major」(.nvmrc / Dockerfile / engines.node) と揃える。
      # 型だけ先に進むと Node 22 に無い API を書いても typecheck が緑のまま通る (fail-open) ため、
      # ランタイムを上げる判断の側で一緒に上げる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # eslint の major (9 → 10) は上流の非互換で止める: eslint-config-next が引き込む
      # eslint-plugin-react / eslint-plugin-import / eslint-plugin-jsx-a11y が peer で eslint ^9 までに
      # 制限しており、eslint 10 では削除済み API を呼ぶため `npm run lint` が必ず落ちる。
      # 解除条件 (プラグインが揃って 10 を許した時点) は tests/dependabot-eslint-guard.test.ts が検出する
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # typescript の major (5 → 7) も上流の非互換で止める: lint の経路に載る typescript-eslint /
      # @typescript-eslint/* が peer で `typescript >=4.8.4 <6.1.0` を、型生成の openapi-typescript が
      # `^5.x` を宣言しているため、7 を入れると `npm ci` が ERESOLVE で落ちて CI はインストールの
      # 時点で赤になる (実測: Dependabot の PR #2 は 3 ジョブすべてがこれで失敗した)。
      # 解除条件 (必須 peer を宣言する依存が揃って 7 を許した時点) は
      # tests/dependabot-typescript-guard.test.ts が lockfile から導いて検出する
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # node ベースイメージの major も同じ理由で単独更新を止める
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
