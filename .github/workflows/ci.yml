# CI: 実装済みの最新 Step のゲート (`npm run gate:step2`: gen / db:generate / lint / format:check / typecheck /
# テスト 60 件以上 / RBAC 3×3 / 料金計算が全モデル分 pass / npm audit high 0 / 本番ビルド / ベンチ 2 本) を検査し、
# あわせて PostgreSQL でのマイグレーション適用・seed の冪等性・prisma アダプタの契約テスト・本番ビルド・
# Docker 起動を確かめる (CLAUDE.md §14、docs/roadmap.md のゲート運用ルール 2)。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定の権限を読み取りのみに落とす (§9 最小権限)
permissions:
  contents: read

jobs:
  # ジョブ名 (= ステータスチェック名) は Step が進んでも変えない (branch protection の必須チェックが Step ごとに
  # 「Expected — Waiting for status」で固まらないように)。どの Step のゲートかはステップ名で示す
  gate:
    name: gate (実装済みの最新 Step の受け入れ基準)
    runs-on: ubuntu-latest
    # Step2 のゲートはベンチ (1 万件投入の日次集計・プロキシ経由の追加遅延) を含むので DB が要る。
    # **接続先は契約テストと同じ専用 DB (末尾 _contract)** — ベンチは全テーブルを TRUNCATE するので、
    # 開発 DB を指していればベンチ側が 1 件も書かずに落ちる (fail-closed)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_ops_bench_contract
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_ops_bench_contract?schema=app
    steps:
      - uses: actions/checkout@v7

      # Node の版は .nvmrc が唯一の正本 (値を書き写さず配線で読む)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ベンチが使うスキーマを作る (接続文字列の ?schema=app と同じ名前)。
      # **接続文字列をそのまま psql へ渡さない** — psql は Prisma 用の ?schema= を解釈できず
      # 「invalid URI query parameter」で落ちる (実測。migrate-and-build ジョブと同じ書き方にそろえる)
      - name: Create bench schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d agent_ops_bench_contract -c 'CREATE SCHEMA IF NOT EXISTS app'

      # ベンチ用のテーブルを用意する (ゲートの中でベンチが TRUNCATE して使う)
      - name: Apply migrations (bench DB)
        run: npm run db:deploy

      # 実装済みの最新 Step の受け入れ基準を 1 コマンドで検査する (赤なら次 Step のブランチを切らない)
      - name: Run latest step gate (gate:step2)
        run: npm run gate:step2

  migrate-and-build:
    name: Migrate (PostgreSQL) / Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_ops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_ops
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI types and Prisma client
        run: npm run gen && npm run db:generate

      # コミット済みマイグレーションが空の DB に連続適用できることを確かめる
      - name: Apply migrations
        run: npm run db:deploy

      # seed が実 DB に対して冪等に通ることを確かめる (2 回流して 2 回目も緑)
      - name: Seed (twice, idempotent)
        run: npm run db:seed && npm run db:seed

      # prisma アダプタの契約テストは全テーブルを TRUNCATE するため、seed 済みの DB とは別の専用 DB で流す
      # 既定の public ではなく専用スキーマを使う。接続文字列の ?schema= は「アダプタの schema オプション」と
      # 「接続時の search_path」の両方へ反映する必要があり (片方だけだと生 SQL が別スキーマを向く)、
      # public のままだと両者の食い違いが CI で一度も試されない
      - name: Create contract-test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE agent_ops_contract'
          PGPASSWORD=postgres psql -h localhost -U postgres -d agent_ops_contract -c 'CREATE SCHEMA IF NOT EXISTS app'

      - name: Apply migrations (contract DB)
        run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_ops_contract?schema=app

      # 本番実装 (prisma アダプタ) が memory アダプタと同じ契約を満たすことを実 DB で確かめる
      - name: Prisma adapter contract tests
        run: npm run test:contract
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_ops_contract?schema=app
          RUN_PRISMA_CONTRACT: '1'

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker (compose up → /api/v1/health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 設定の構文と変数展開を検査する
      - name: Validate compose file
        run: docker compose config --quiet

      # クリーンな状態から build → 起動 → マイグレーション適用まで通す (Step7 の「compose up でデモ動作」の前倒し検証)
      - name: Build and start
        run: docker compose up -d --build

      # app の healthcheck (/api/v1/health = DB 到達性込み) が healthy になるまで待つ
      - name: Wait for app to become healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            echo "app health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "app did not become healthy"; docker compose logs app; exit 1

      # ホストから実際に応答を確かめる (200 と ok:true)
      - name: Probe /api/v1/health
        run: curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q '"ok":true'

      - name: Tear down
        if: always()
        run: docker compose down -v
