# docker compose で起動するサービス群の定義 (クリーン環境で `docker compose up` → デモ動作が Step7 の基準)
services:
  # PostgreSQL データベースサービス
  db:
    # 軽量な Alpine ベースの Postgres 16 公式イメージ
    image: postgres:16-alpine
    # コンテナが落ちたら自動再起動 (手動 stop は除く)
    restart: unless-stopped
    # 初期化に使う環境変数 (ローカル専用の既定値。本番では別途設定する)
    environment:
      POSTGRES_DB: agent_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # データ永続化用ボリューム
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ホストの 5432 をコンテナの 5432 に公開 (ローカルから DB クライアントで繋げる)。
    # **必ずループバックに限定する** — 既定値のままだと 0.0.0.0 に公開され、既定資格情報のまま
    # 同一 LAN の誰でも接続できる。この DB は Bearer 認証の資格情報ストアそのものなので
    # (UserToken.tokenHash が一致すればその principal になる)、1 行 INSERT するだけで
    # RBAC・テナント境界・失効・期限のすべてが迂回される
    ports:
      - '127.0.0.1:5432:5432'
    # ヘルスチェック: pg_isready で接続可能か 5 秒おきに確認
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js アプリ本体のサービス
  app:
    # カレントディレクトリの Dockerfile からビルド
    build:
      context: .
    # 自動再起動
    restart: unless-stopped
    # ホストの 3000 をコンテナの 3000 に公開
    ports:
      - '3000:3000'
    # 実行時の環境変数
    environment:
      # コンテナのタイムゾーンを日本時間に設定
      TZ: Asia/Tokyo
      # DB 接続文字列 (db サービスの 5432 を指す)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/agent_ops
      # プラットフォーム管理者トークン (.env から渡す。空なら未設定 = テナント作成は誰もできない)
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:-}
      # **以下は `.env.example` にある設定を 1 つずつ素通しする。** 渡し忘れた設定は
      # `docker compose up` の配備でだけ「未設定」として fail-closed に倒れ、しかも
      # lint もテストも緑のまま通る (実測: AUDIT_HMAC_SECRET を渡していなかったため、
      # Docker 経路では発火の監査ログが常に書けず /audit-logs/verify も常に 503 だった)。
      # 渡し忘れは tests/deployment-invariants.test.ts が `.env.example` から導いて落とす。
      # 既定値はすべて空にする (リポジトリに書かれた資格情報で動く配備を作らない)
      #
      # 上流 LLM の接続先と資格情報 (プロキシと評価の judge が使う)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # 上流へ費用を発生させる経路の 1 分あたりの上限 (空なら定数の既定値)
      PROXY_RATE_LIMIT_PER_MINUTE: ${PROXY_RATE_LIMIT_PER_MINUTE:-}
      # 採点に使う judge の provider / model (未設定なら定数の既定値)
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      # 監査ログの HMAC 鍵 (Step4)。鍵が無いと `auditHmacSecret()` は 503 を投げ、
      # 発火の記録は握られてログだけに残り、/audit-logs/verify は常に 503 になる
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:-}
      # ガードレールの通知先と署名鍵 (Step4)。空なら通知を送らず記録と停止だけを行う
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_MAIL_WEBHOOK_URL: ${NOTIFY_MAIL_WEBHOOK_URL:-}
      NOTIFY_SIGNING_SECRET: ${NOTIFY_SIGNING_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    # db のヘルスチェックが green になってから起動する
    depends_on:
      db:
        condition: service_healthy
    # アプリ側のヘルスチェック: /api/v1/health が 200 を返せば正常 (DB 到達性も含む)
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

# 名前付きボリュームの宣言 (永続データ用)
volumes:
  pgdata:
