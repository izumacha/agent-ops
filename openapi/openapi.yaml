# Agent Ops REST API の OpenAPI 定義 (正本)。
# `npm run gen` が src/generated/openapi.d.ts に TypeScript 型を生成し、ルートハンドラはその型を使う。
# Step1 で src/app/api/v1/* に実装済み。この定義と一致することを tests/api/*.test.ts で固定する (docs/adr/0003-openapi-first.md)。
# 認証は Bearer (docs/adr/0005-bearer-token-auth.md): ユーザートークン (aop_u_...) か、テナント作成・列挙専用の
# プラットフォーム管理者トークン (環境変数 PLATFORM_ADMIN_TOKEN)。
openapi: 3.1.0
info:
  title: Agent Ops API
  version: 0.1.0
  description: AI エージェントの登録・権限・コスト・品質・停止を管理する API。
servers:
  - url: /api/v1
    description: 同一オリジン (Next.js Route Handlers)
tags:
  - name: health
    description: 生存確認
  - name: tenants
    description: テナント (Step1)
  - name: users
    description: ユーザー・役割・ログイントークン (Step1)
  - name: agents
    description: エージェント台帳 (Step1)
  - name: api-keys
    description: API キー発行 (Step1)
  - name: proxy
    description: LLM 呼び出しの中継とコスト計測 (Step2)
  - name: usage
    description: 利用量・コストの集計 (Step2)
  - name: evaluations
    description: 品質評価 (LLM-as-judge による採点と回帰比較。Step3)
  - name: guardrails
    description: ガードレールのルールと明示実行 (しきい値超過の検知と自動停止。Step4)
  - name: incidents
    description: ガードレールの発火記録と解決 (Step4)
  - name: audit-logs
    description: 監査ログの閲覧とハッシュ連鎖の検証 (Step4)
  - name: billing
    description: 契約プランの参照と課金事業者からの受信 Webhook (Step6)
  - name: metrics
    description: プロセス内のカウンタの出口 (Prometheus のテキスト形式。運用の観測。ADR-0014)
  - name: maintenance
    description: 保守の定期実行 (ガードレールの定期掃きとレート制限の記録の回収。ADR-0016)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: アプリと DB の生存確認
      security: []
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: DB に到達できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: プロセス内のカウンタ (監視専用トークンのみ)。Prometheus のテキスト形式で返す
      description: >-
        Prometheus の収集エージェントが読む運用の数字。**認証は専用の読み取りトークン**
        (環境変数 METRICS_TOKEN) で、ユーザートークンもプラットフォーム管理者トークンも受け付けない
        (あちらはテナント作成とプラン変更も通るため。§9 最小権限)。値はこのインスタンスの分だけで、
        足し合わせるのはスクレイプ側。DB を引かないのでスクレイプが本番の負荷にならない。
      security:
        - metricsToken: []
      responses:
        '200':
          description: 1 行 1 系列のテキスト (値はこのインスタンスの分だけ。足し合わせるのはスクレイプ側)
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 監視用トークンが未設定・短すぎる (設定が無いので誰も通れない = fail-closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: テナント一覧 (プラットフォーム管理者のみ)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [tenants]
      operationId: createTenant
      summary: テナント作成 (プラットフォーム管理者のみ)。最初の admin ユーザーとそのログイントークンを同時に作る (UC-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: 作成した (adminToken.secret はこの応答でのみ返す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getTenant
      summary: 自テナントの取得 (view 権限。他テナントの id は 404)
      responses:
        '200':
          description: テナント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [tenants]
      operationId: updateTenantPlan
      summary: 契約プランと課金連携の変更 (プラットフォーム管理者専用)
      description: |-
        **テナント内の admin は呼べない** (403)。課金の実体は事業者側にあるので、アプリ側で
        勝手に上げられると請求と権限が食い違う。通常の経路は事業者の契約 → 受信 Webhook で、
        ここは運用の手当て (移行・障害時の暫定対応・事業者を介さない契約) のために残してある。

        **事業者側の顧客 ID (`billingCustomerId`) を結び付けるのもこの経路。** 受信 Webhook は
        顧客 ID で**テナントを引く**だけで書かないので、ここで結び付けないとイベントは
        受け取るだけで反映されない (`applied: false`)。項目を省略すると据え置き、`null` で外す。

        **変更は監査ログ (tenant.plan_changed) に残る。** 監査ログの鍵が未設定なら 503 で
        **何も変えずに**断る (記録の無い変更を残さない)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPlanUpdate'
      responses:
        '200':
          description: 変更後のテナント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: 認証中のユーザーと所属テナント (テナントのユーザーのみ)
      responses:
        '200':
          description: 自分の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 自テナントのユーザー一覧
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [users]
      operationId: createUser
      summary: ユーザー招待 (admin ロール限定)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [users]
      operationId: disableUser
      summary: ユーザー無効化 (admin ロール限定)。監査ログの操作者は削除できないため、削除の代わりに無効化する。自分自身・最後の有効な admin は 409
      responses:
        '200':
          description: 無効化後のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: updateUserRole
      summary: 役割変更 (admin ロール限定)。最後の有効な admin を降格する変更と、無効化済みユーザーへの変更は 409
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: 更新後のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/{userId}/tokens:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: listUserTokens
      summary: ユーザーのログイントークン一覧 (admin ロール限定。平文は含まない)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [users]
      operationId: createUserToken
      summary: ログイントークン発行 (admin ロール限定。平文はこの応答でのみ返す。無効化されたユーザーには 409)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTokenCreate'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenIssued'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/{userId}/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [users]
      operationId: revokeUserToken
      summary: ログイントークン失効 (admin ロール限定)
      responses:
        '204':
          description: 失効した
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: エージェント一覧 (view 権限)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AgentStatus'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [agents]
      operationId: createAgent
      summary: エージェント登録 (execute 権限)
      description: |-
        **登録できる件数は契約プランの上限まで** (Step6)。上限に達していれば 409 を返す
        (不要なエージェントを削除するか、プランを見直す)。上限はプランごとに違うので、
        現在の値は `GET /billing` で参照する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      summary: エージェント取得 (view 権限)
      responses:
        '200':
          description: エージェント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: エージェント更新 (execute 権限)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: 更新後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: エージェント削除 (stop 権限)。利用・評価・インシデントの履歴があるエージェントは削除できない (409。stop を使う)
      responses:
        '204':
          description: 削除した
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents/{agentId}/stop:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: stopAgent
      summary: エージェント停止 (stop 権限)
      responses:
        '200':
          description: 停止後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents/{agentId}/resume:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: resumeAgent
      summary: エージェント復帰 (stop 権限)
      responses:
        '200':
          description: 復帰後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: API キー一覧 (view 権限。平文は含まない)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: API キー発行 (execute 権限。平文はこの応答でのみ返す。agentId が自テナントに無ければ 422)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssued'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api-keys/{apiKeyId}:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: API キー失効 (stop 権限。失効済みのキーへの再実行も 204)
      responses:
        '204':
          description: 失効した
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /proxy/anthropic/messages:
    post:
      tags: [proxy]
      operationId: proxyAnthropicMessages
      summary: Anthropic Messages API への中継 (API キー認証。トークン・料金を UsageEvent に記録する)
      description: |
        本文をそのまま Anthropic の Messages API へ中継し、応答のトークン数から料金を計算して記録する。
        **認証は API キー (aop_k_...) だけ**で、ユーザートークンでは 401 になる (docs/adr/0007-cost-proxy.md)。
        エージェントに紐づいていないキー・停止中のエージェントのキーは 403。
        料金表 (src/domain/pricing/vendor-prices.json) に無いモデルは計測できないので中継せず 422。
        ストリーミング (stream: true) は Step2 の範囲外で 422。
        本文の入れ子が深すぎる場合も 422（規則は ValidationError の説明を参照。全操作に共通）。

        上流の応答の扱い: 2xx はそのまま返す。**ステータスを保って中継する 4xx は 400 / 413 / 422 だけ**
        (「送り主自身の要求についての診断」と言い切れるもの。許可リストなので、それ以外の 4xx —
        402 / 404 / 409 など — は 502 に写す。402 は番号そのものが上流アカウントの課金状態を語る)。
        中継する場合も**本文は機械可読な項目 (`error.type` / `error.code` / `error.param` と
        最上位の `type`) に絞る** — 自由記述の `message` には上流アカウントの残高・組織名・
        契約ティアが載るため。401 / 403 は 502 に写し、429 は 429 のまま定型文へ差し替えて
        Retry-After (整数の秒数のときだけ) を中継する。5xx は 502。
        **上流の本文が JSON として読めない場合 (HTML のエラーページ、本文を持てない 204 / 304、
        上限を超える大きさ) も 502** で、本文は返さない。

        **本文は受け取ったバイト列をそのまま流さず、検証済みの値を JSON へ組み立て直して送る**。
        そのため JSON の正規化が起きる: 2^53 を超える整数は丸められ、1e400 は null、-0 は 0 になる。
        巨大な整数を seed などに渡す場合はこの点に注意する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
      responses:
        '200':
          description: 上流の応答 (本文の形はベンダーの仕様に従うためそのまま返す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ProxyRelayedError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ProxyRelayedError'
        '413':
          $ref: '#/components/responses/ProxyRelayedError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
