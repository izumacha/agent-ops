# Agent Ops REST API の OpenAPI 定義 (正本)。
# `npm run gen` が src/generated/openapi.d.ts に TypeScript 型を生成し、ルートハンドラはその型を使う。
# 実装は Step1 で行い、この定義と一致することを API テストで固定する (docs/adr/0003-openapi-first.md)。
openapi: 3.1.0
info:
  title: Agent Ops API
  version: 0.1.0
  description: AI エージェントの登録・権限・コスト・品質・停止を管理する API。
servers:
  - url: /api/v1
    description: 同一オリジン (Next.js Route Handlers)
tags:
  - name: health
    description: 生存確認
  - name: tenants
    description: テナント (Step1)
  - name: users
    description: ユーザーと役割 (Step1)
  - name: agents
    description: エージェント台帳 (Step1)
  - name: api-keys
    description: API キー発行 (Step1)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: アプリと DB の生存確認
      security: []
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: DB に到達できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: テナント一覧 (システム管理者のみ)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [tenants]
      operationId: createTenant
      summary: テナント作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getTenant
      summary: テナント取得
      responses:
        '200':
          description: テナント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 自テナントのユーザー一覧
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
    post:
      tags: [users]
      operationId: createUser
      summary: ユーザー招待 (admin のみ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: updateUserRole
      summary: 役割変更 (admin のみ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: 更新後のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: エージェント一覧 (view 権限)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AgentStatus'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
    post:
      tags: [agents]
      operationId: createAgent
      summary: エージェント登録 (execute 権限)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      summary: エージェント取得 (view 権限)
      responses:
        '200':
          description: エージェント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: エージェント更新 (execute 権限)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: 更新後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: エージェント削除 (stop 権限)
      responses:
        '204':
          description: 削除した
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{agentId}/stop:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: stopAgent
      summary: エージェント停止 (stop 権限)
      responses:
        '200':
          description: 停止後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /agents/{agentId}/resume:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: resumeAgent
      summary: エージェント復帰 (stop 権限)
      responses:
        '200':
          description: 復帰後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: API キー一覧 (view 権限。平文は含まない)
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: API キー発行 (execute 権限。平文はこの応答でのみ返す)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssued'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api-keys/{apiKeyId}:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: API キー失効 (stop 権限)
      responses:
        '204':
          description: 失効した
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 発行済み API キー、またはログインセッションのトークン
  parameters:
    Limit:
      name: limit
      in: query
      description: 取得件数 (既定 50、最大 200。§8 一覧は必ず上限を持つ)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: ページネーションカーソル (前回応答の nextCursor)
      schema:
        type: string
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
  responses:
    Forbidden:
      description: 権限がない (RBAC 違反)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 見つからない (他テナントの資源も 404 で隠す)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: 入力検証エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          description: HTTP ステータス
        message:
          type: string
          description: 利用者向けの日本語メッセージ (内部詳細は含めない)
        issues:
          type: array
          description: 入力検証の詳細 (422 のとき)
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
    Health:
      type: object
      required: [ok, db]
      properties:
        ok:
          type: boolean
        db:
          type: string
          enum: [up, down]
    Plan:
      type: string
      enum: [free, pro, enterprise]
    Role:
      type: string
      enum: [viewer, operator, admin]
    AgentStatus:
      type: string
      enum: [active, stopped, suspended]
    Provider:
      type: string
      enum: [anthropic, openai]
    Tenant:
      type: object
      required: [id, name, plan, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        plan:
          $ref: '#/components/schemas/Plan'
        createdAt:
          type: string
          format: date-time
    TenantCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        nextCursor:
          type: string
    User:
      type: object
      required: [id, tenantId, email, name, role, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    UserCreate:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
    Agent:
      type: object
      required: [id, tenantId, name, provider, model, status, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        model:
          type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
        budgetMicroUsd:
          type: string
          description: 月次予算 (マイクロ USD)。BigInt を JSON で安全に運ぶため文字列
        createdAt:
          type: string
          format: date-time
    AgentCreate:
      type: object
      required: [name, provider, model]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        provider:
          $ref: '#/components/schemas/Provider'
        model:
          type: string
          minLength: 1
          maxLength: 100
        budgetMicroUsd:
          type: string
          pattern: '^[0-9]+$'
    AgentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        model:
          type: string
          minLength: 1
          maxLength: 100
        budgetMicroUsd:
          type: string
          pattern: '^[0-9]+$'
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        nextCursor:
          type: string
    ApiKey:
      type: object
      required: [id, tenantId, prefix, name, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        agentId:
          type: string
        prefix:
          type: string
          description: 先頭数文字 (特定用。秘密ではない)
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        agentId:
          type: string
    ApiKeyIssued:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 平文キー。発行時の応答でのみ返し、以後は取得できない
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
