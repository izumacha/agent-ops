  /audit-logs/verify:
    get:
      tags: [audit-logs]
      operationId: verifyAuditLogs
      summary: |
        監査ログのハッシュ連鎖を検証する (admin ロール限定)。テナントの行を連番順に読み、
        記録されたハッシュを鍵付きで再計算して突き合わせる。壊れていれば**最初に壊れた連番と
        その理由**を返す。鍵 (AUDIT_HMAC_SECRET) が未設定・短すぎるときは 503。

        1 回に読む件数には上限 (src/lib/constants.ts の AUDIT_CHAIN_VERIFY_MAX_ROWS) があり、
        続きがあるときは reachedLimit: true と nextFromSeq を返す。**その値を fromSeq に渡して
        続きを検証する** — 渡さないと毎回最古の区間だけを検証することになり、それ以降の行は
        一度も確かめられない

        **この API でいちばん重い読み取り**（1 回で最大 10,000 行を読み、その件数ぶん HMAC を
        計算し直す = 一覧の上限の 50 倍）なので、テナントあたりの小さい枠が掛かる (超過は 429)
      parameters:
        - name: fromSeq
          in: query
          required: false
          description: |
            読み始める行の連番 (1 以上 9223372036854775807 以下の整数。既定は先頭)。
            上限は seq 列 (PostgreSQL の BIGINT) が取りうる最大値で、**越えた値は 422** —
            そのまま DB へ渡すと利用者の入力が原因なのに 500 になる。
            前の区間の応答の nextFromSeq を渡す。
            **壊れているとき (ok: false) は nextFromSeq を返さない** — 壊れた位置から区間の
            終わりまでは検証できていないので、カーソルを追うと その範囲が永久に飛ばされる。
            片付けてから brokenSeq の続きを自分で指す。

            **区間の継ぎ目も検証される** (1 つ前の行のハッシュを錨にして、最初の行の
            prevHash と突き合わせる) ので、区間に分けても連鎖の強さは落ちない。

            **末尾を越えた連番 (その連番以降に行が無い) は 422。** 0 件を検証して
            「ok: true / verified: 0」を返すと、古いカーソルを握った監視が「連鎖は健全」と
            報告し続ける (このパラメータが防ぐはずだった fail-open そのもの)。
            行が 1 件も無いテナントは 200 (検証すべきものが無い)
          schema:
            type: string
            # 桁数の上限は BIGINT の最大桁数 (19)。値そのものの上限は上の description のとおりで、
            # 19 桁でも越えることがあるのでアプリ側 (Zod) が値でも比べる
            pattern: '^[0-9]{1,19}$'
      responses:
        '200':
          description: 検証した (壊れていても 200。壊れているかは本文の ok で示す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /billing:
    get:
      tags: [billing]
      operationId: getBilling
      summary: 現在の契約プランとその上限 (view 権限)
      description: |-
        **409 / 403 を受けたときに「いまの上限はいくつか」を知る経路。** 上限はプランごとに違うので
        エラーの文言には数値を書かない (書くと 1 つの定数では表せない) 代わりに、ここで参照する。
        プランを変える経路はここには無い (課金事業者の Webhook とプラットフォーム管理者の
        `PATCH /tenants/{tenantId}` の 2 つだけ)。
      responses:
        '200':
          description: 現在のプランと上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /billing/webhook:
    post:
      tags: [billing]
      operationId: receiveBillingWebhook
      summary: 課金事業者からの受信 Webhook (署名で認証)
      description: |-
        **Bearer 認証を使わない唯一の書き込み経路。** 呼ぶのは課金事業者 (Stripe) なので、
        認証は `Stripe-Signature` ヘッダの HMAC-SHA256 署名で行う (共有シークレットは
        環境変数 `STRIPE_WEBHOOK_SECRET`)。署名が確認できなければ 401、シークレットが
        未設定・短すぎれば 503 (fail-closed: 検証せずに受け入れることはしない)。

        **同じイベントの再送は正常系**で、2 通目は何もせず 200 を返す (`applied: false`)。
        冪等性は DB の一意制約 `(provider, eventId)` が保証するので、同時に届いた 2 通でも
        反映は 1 回だけになる。**知らない種別・知らない価格でも 200** を返す (エラーにすると
        事業者が再送を続け、処理すべきイベントの配信が遅れる)。

        本文は事業者が作るペイロードなので**未知のキーを拒否しない** (`additionalProperties`
        を閉じない)。読むのは「どのイベントか・どの顧客か・どのプランか」だけ。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingWebhookEvent'
      responses:
        '200':
          description: 受信した (反映したかは applied が示す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /maintenance/run:
    post:
      tags: [maintenance]
      operationId: runMaintenance
      summary: |
        保守の定期実行 (プラットフォーム管理者のみ)。スケジューラから繰り返し叩く

        2 つの後片付けを 1 要求ぶんだけ進める: (1) **ガードレールの定期掃き** —
        集計窓から古い行が抜けるだけでしきい値を越えるルール (エラー率・品質) は、
        使われなくなったエージェントでは判定を起こす要求が無いので永久に発火しない。
        (2) **レート制限の記録の回収** — 二度と来ないキー (解約したテナント) の行は誰も消さない。

        **1 要求でやる仕事には上限があり、続きはカーソルで返る。** `passComplete` が真に
        なるまで `nextTenantCursor` / `nextAgentCursor` をそのまま送り返して繰り返す
        (`null` のカーソルは送らない)。`failed` が 0 でなくても 200 を返す — 一巡を回し切ること
        自体が仕事なので、500 にすると呼び出し側が続きのカーソルを受け取れずそれ以降が
        丸ごと判定されない。件数は応答で見える (サーバログにも 1 行ずつ残る)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRunRequest'
      responses:
        '200':
          description: 1 要求ぶん進めた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRunResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ユーザーのログイントークン (aop_u_...)、またはテナント作成・列挙専用のプラットフォーム管理者トークン (環境変数 PLATFORM_ADMIN_TOKEN)。API キー (aop_k_...) は Step2 のプロキシ専用でこの API では使えない
    metricsToken:
      type: http
      scheme: bearer
      description: >-
        監視の収集エージェント専用の読み取りトークン (環境変数 METRICS_TOKEN)。
        テナントを持たず役割も持たないので RBAC の対象外で、403 ではなく 401 で弾く。
        **プラットフォーム管理者トークンでは読めない** (あちらはテナント作成 —
        応答に新しいテナントの admin トークンの平文が載る — とプラン変更も通るため)
  parameters:
    Limit:
      name: limit
      in: query
      description: 取得件数 (既定 50、最大 200。§8 一覧は必ず上限を持つ)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: ページネーションカーソル (前回応答の nextCursor)
      schema:
        type: string
        minLength: 1
        maxLength: 200
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
    SetId:
      name: setId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: 認証情報が無い、または無効 (失効・期限切れ・ユーザー無効化を含む。理由は区別しない)
      headers:
        WWW-Authenticate:
          description: 'Bearer realm="agent-ops" (無し) / Bearer realm="agent-ops", error="invalid_token" (無効)'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: リクエスト本文を JSON として解釈できない (本文が最後まで届かなかった場合を含む)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: リクエスト本文が上限 (src/lib/constants.ts の JSON_BODY_MAX_BYTES) を超えている
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type が application/json でない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 権限がない (RBAC 違反)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 見つからない (他テナントの資源も 404 で隠す)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: サーバー内部のエラー (応答は内部詳細を含まない。詳細はサーバログに残る)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProxyRelayedError:
      description: |
        プロキシ自身が要求を拒否した (本文が JSON でない・上限超過・未対応モデル・
        **本文の入れ子が深すぎる** など。深さの規則は ValidationError の説明が正本で、
        本文を取るすべての操作に等しく効く) か、
        上流が拒否したかのどちらか。前者は API 共通のエラー形 ({status, message} / {status, message, issues})、
        後者は上流の形を保った RelayedUpstreamError で、**本文は機械可読な項目だけに絞ってある**
        (自由記述には上流アカウントの残高・組織名・契約ティアが載るため)。
        **ステータスを保って中継するのは 400 / 413 / 422 だけ**で、それ以外の上流 4xx は 502 に写す
        (402 のように番号そのものが上流アカウントの課金状態を語るため。許可リスト = fail-closed)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/RelayedUpstreamError'
    TooManyRequests:
      description: |
        要求が多すぎる。2 つの原因がある:
        (a) **このサービスのレート制限** — 窓の中で出せる回数を超えた。数える単位は
        **テナント** (プラットフォーム管理者トークンだけは単一の枠。API キーやユーザーを
        増やしても枠は増えない) で、枠は重さの理由ごとに分かれている:
        対象のすべての経路が消費する枠 (**契約プランごと**。正本は src/domain/plan.ts の
        PLAN_LIMITS の proxyRateLimitPerMinute で、いまの値は GET /billing が返す。
        環境変数 PROXY_RATE_LIMIT_PER_MINUTE で上書きするとプランの差が消える) に加えて、評価の実行は
        FAN_OUT_ROUTE_RATE_LIMIT_PER_MINUTE、ガードレールの明示実行は
        OUTBOUND_WAIT_ROUTE_RATE_LIMIT_PER_MINUTE の小さい枠も消費する。
        Retry-After はこちらが計算した秒数で、複数の枠が尽きている場合は長いほうを返す。
        上流へは 1 度も出ていないので課金も発生しない。
        (b) **上流の LLM プロバイダが混雑を返した** — 本文は定型文に差し替える (上流の本文には
        組織名やクォータの状況が載るため) が、上流が Retry-After を返した場合はその値だけ中継する
      headers:
        Retry-After:
          description: 再試行までの待ち時間 (上流が指示した場合のみ)
          required: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: 上流の LLM プロバイダの呼び出しに失敗した
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: このプロバイダへの中継が設定されていない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeout:
      description: 上流の LLM プロバイダが時間内に応答しなかった
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 現在の状態では実行できない (履歴を持つ資源の削除など)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: |-
        入力検証エラー。スキーマに合わない本文のほか、**本文の入れ子が深すぎる場合**も含む
        (上限は src/lib/body-limits.ts の JSON_BODY_MAX_DEPTH。サイズだけでは資源の消費を縛れないため
        深さにも明示の上限を置いており、判定は本文を読む共通の入口にあるので
        本文を取るすべての操作に等しく効く)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          description: HTTP ステータス
        message:
          type: string
          description: 利用者向けの日本語メッセージ (内部詳細は含めない)
        issues:
          type: array
          description: 入力検証の詳細 (422 のとき)
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                description: "誤りのあるフィールド (入れ子は '.' 区切り)。本文全体に対する誤り、たとえば変更する項目が 1 つも無い場合は空文字"
              message:
                type: string
    Health:
      type: object
      required: [ok, db]
      properties:
        ok:
          type: boolean
        db:
          type: string
          enum: [up, down]
    Plan:
      type: string
      enum: [free, pro, enterprise]
    Role:
      type: string
      enum: [viewer, operator, admin]
    AgentStatus:
      type: string
      enum: [active, stopped, suspended]
    Provider:
      type: string
      enum: [anthropic, openai]
    RuleKind:
      type: string
      description: |
        ガードレールの種別。cost と error_rate は**しきい値を上回ったら**発火、quality は
        **下回ったら**発火する (向きの正本は src/domain/guardrail/rule.ts の RULE_COMPARISON)。

        **測れていない窓では発火しない**: 呼び出しが 0 件の窓 (cost / error_rate)、採点が 0 件の
        評価 (quality)、そして **error_rate は窓の中の呼び出しが
        GUARDRAIL_ERROR_RATE_MIN_REQUESTS 件に届かない場合**。最後の 1 つがあるのは、1 件だけ
        呼んで失敗した窓が 1/1 = 100% になり、しきい値をどう置いても必ず発火してしまうため
        (失敗には送り主自身のペイロードの誤り = 4xx も入るので、低トラフィックのエージェントが
        1 回のミスで自動停止する)。低トラフィックのエージェントに error_rate を設定しても
        発火しないのはこの理由で、窓を長くすると分母が増えて発火するようになる
      enum: [cost, error_rate, quality]
    RuleAction:
      type: string
      description: 発火したときの動作 (notify = 記録と通知だけ、stop = それに加えて自動停止)
      enum: [notify, stop]
    IncidentStatus:
      type: string
      enum: [open, resolved]
    Tenant:
      type: object
      required: [id, name, plan, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        plan:
          $ref: '#/components/schemas/Plan'
        createdAt:
          type: string
          format: date-time
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name, adminEmail, adminName]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        adminEmail:
          type: string
          format: email
          maxLength: 254
          description: 最初の admin ユーザーのメール
        adminName:
          type: string
          minLength: 1
          maxLength: 100
          description: 最初の admin ユーザーの表示名
    TenantCreated:
      type: object
      required: [tenant, admin, adminToken]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        admin:
          $ref: '#/components/schemas/User'
        adminToken:
          $ref: '#/components/schemas/UserTokenIssued'
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        nextCursor:
          type: string
    User:
      type: object
      required: [id, tenantId, email, name, role, disabledAt, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        disabledAt:
          type: [string, 'null']
          format: date-time
          description: 無効化日時 (有効なら null)。無効化されたユーザーのトークンは 401 になる
        createdAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [user, tenant]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          $ref: '#/components/schemas/Tenant'
    UserToken:
      type: object
      required: [id, userId, prefix, name, createdAt, expiresAt, revokedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        prefix:
          type: string
          description: 先頭数文字 (特定用。秘密ではない)
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 有効期限 (既定 90 日、最長 365 日。無期限は作れない)
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: 失効日時 (有効なら null)
    UserTokenCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: '用途メモ (例: CLI、CI)'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    UserTokenIssued:
      allOf:
        - $ref: '#/components/schemas/UserToken'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 平文トークン。発行時の応答でのみ返し、以後は取得できない
    UserTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserToken'
        nextCursor:
          type: string
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 小文字に正規化して保存する (テナント内の一意性と検索は大文字小文字を区別しない)
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
    Agent:
      type: object
      required:
        [id, tenantId, name, description, provider, model, status, budgetMicroUsd, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        provider:
          $ref: '#/components/schemas/Provider'
        model:
          type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
        budgetMicroUsd:
          type: [string, 'null']
          description: 月次予算 (マイクロ USD)。BigInt を JSON で安全に運ぶため文字列。未設定は null
        createdAt:
          type: string
          format: date-time
    AgentCreate:
      type: object
      additionalProperties: false
      required: [name, provider, model]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        provider:
          $ref: '#/components/schemas/Provider'
        model:
          type: string
          minLength: 1
          maxLength: 100
        budgetMicroUsd:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: マイクロ USD の整数 (PostgreSQL BIGINT の範囲。19 桁まで。上限 9223372036854775807 を超える値は JSON Schema で表せないため 422 を返す)
    AgentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: 省略したプロパティは変更しない。null を送ると未設定に戻す (description / budgetMicroUsd)。1 つも指定が無い本文は 422
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
        model:
          type: string
          minLength: 1
          maxLength: 100
        budgetMicroUsd:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          maxLength: 19
          description: マイクロ USD の整数 (PostgreSQL BIGINT の範囲。19 桁まで。上限 9223372036854775807 を超える値は JSON Schema で表せないため 422 を返す)
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        nextCursor:
          type: string
    ApiKey:
      type: object
      required: [id, tenantId, agentId, prefix, name, createdAt, revokedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        agentId:
          type: [string, 'null']
          description: 紐づくエージェント (テナント共通キーなら null)
        prefix:
          type: string
          description: 先頭数文字 (特定用。秘密ではない)
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: 失効日時 (有効なら null)
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        agentId:
          description: 紐づけるエージェントの id (資源 id の形。形が違う値は 422)
          type: string
          minLength: 1
          maxLength: 64
    ApiKeyIssued:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 平文キー。発行時の応答でのみ返し、以後は取得できない
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        nextCursor:
          type: string
    EvaluationSet:
      type: object
      required: [id, tenantId, name, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    EvaluationCase:
      type: object
      required: [id, position, input, expected]
      properties:
        id:
          type: string
        position:
          type: integer
          description: セット内の並び順 (0 始まり)
        input:
          type: string
        expected:
          type: [string, 'null']
          description: 期待する出力 (任意。採点の参考情報)
    EvaluationSetDetail:
      allOf:
        - $ref: '#/components/schemas/EvaluationSet'
        - type: object
          required: [cases]
          properties:
            cases:
              type: array
              description: position 昇順
              items:
                $ref: '#/components/schemas/EvaluationCase'
    EvaluationSetCreate:
      type: object
      additionalProperties: false
      required: [name, cases]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        cases:
          type: array
          description: 配列の順がそのまま position になる。実行履歴を持つセットのケースは変更できない
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [input]
            properties:
              input:
                type: string
                minLength: 1
                maxLength: 1000
              expected:
                type: string
                minLength: 1
                maxLength: 1000
    EvaluationSetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationSet'
        nextCursor:
          type: string
    EvaluationRun:
      type: object
      required:
        [
          id,
          tenantId,
          agentId,
          setId,
          status,
          accuracy,
          safety,
          deviation,
          scoredCases,
          excludedCases,
          judgeProvider,
          judgeModel,
          createdAt,
        ]
      properties:
        id:
          type: string
        tenantId:
          type: string
        agentId:
          type: string
        setId:
          type: string
        status:
          type: string
          enum: [completed, failed]
          description: 除外が多すぎる実行は failed (採点として使えない)
        accuracy:
          type: [number, 'null']
          description: 採点できたケースの平均。1 件も採点できなければ null (0.0 ではない)
        safety:
          type: [number, 'null']
        deviation:
          type: [number, 'null']
          description: 低いほど良い
        scoredCases:
          type: integer
        excludedCases:
          type: integer
        judgeProvider:
          type: string
          enum: [anthropic, openai]
        judgeModel:
          type: string
        createdAt:
          type: string
          format: date-time
    EvaluationResult:
      type: object
      required: [caseId, accuracy, safety, deviation, excludedReason]
      properties:
        caseId:
          type: string
        accuracy:
          type: [number, 'null']
        safety:
          type: [number, 'null']
        deviation:
          type: [number, 'null']
        excludedReason:
          type: [string, 'null']
          enum:
            [
              unknown_case_id,
              duplicate_case_id,
              score_out_of_range,
              missing_score,
              unparsable_output,
              judge_unavailable,
              agent_unavailable,
              null,
            ]
          description: 除外した理由 (採点できたケースでは null)
    EvaluationRegression:
      type: object
      required: [previousRunId, accuracyDelta, safetyDelta, deviationDelta]
      description: 同じエージェント × セットの直前の実行との差 (今回 − 前回)。片方でも平均が無ければ差は null
      properties:
        previousRunId:
          type: string
        accuracyDelta:
          type: [number, 'null']
        safetyDelta:
          type: [number, 'null']
        deviationDelta:
          type: [number, 'null']
    EvaluationRunDetail:
      allOf:
        - $ref: '#/components/schemas/EvaluationRun'
        - type: object
          required: [results, regression]
          properties:
            results:
              type: array
              description: ケースの position 昇順
              items:
                $ref: '#/components/schemas/EvaluationResult'
            regression:
              oneOf:
                - $ref: '#/components/schemas/EvaluationRegression'
                - type: 'null'
              description: 比較相手が無ければ null (初回の実行)
    EvaluationRunCreate:
      type: object
      additionalProperties: false
      required: [agentId, setId]
      properties:
        agentId:
          description: 評価対象エージェントの id (資源 id の形)
          type: string
          minLength: 1
          maxLength: 64
        setId:
          description: 使う評価セットの id (資源 id の形)
          type: string
          minLength: 1
          maxLength: 64
    EvaluationRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationRun'
        nextCursor:
          type: string
    ProxyRequest:
      type: object
      description: |
        中継する本文。**ベンダーのペイロードそのもの**なので未知キーを許す (additionalProperties: true)。
        計測に必要な model だけを必須とし、未対応の stream: true を拒む。この 1 件だけ
        「未知キーを閉じる」原則の例外で、理由は tests/openapi.test.ts の除外表と ADR-0007 にある。
      additionalProperties: true
      required: [model]
      properties:
        model:
          type: string
          maxLength: 100
          description: 使用するモデル名。料金表に無いモデルは中継せず 422
        stream:
          type: boolean
          enum: [false]
          description: ストリーミングは Step2 の範囲外。省略するか false を指定する
    ProxyResponse:
      type: object
      description: 上流の応答をそのまま返す (項目はベンダーの仕様に従う)
      additionalProperties: true
    RelayedUpstreamError:
      type: object
      description: |
        プロキシが中継する上流のエラー本文。ベンダーの形は保つが、通すのは機械可読な識別子だけで、
        自由記述の message はプロキシの定型文に置き換わる (docs/adr/0007-cost-proxy.md 決定 7)。
      properties:
        type:
          type: string
          enum: [error]
          description: |
            上流が最上位に置いた種別。入る値は 'error' ただ 1 つ (Anthropic の慣習) なので
            閉じた語彙で通す。それ以外の値は中継せず、この項目ごと落ちる
        error:
          type: object
          properties:
            message:
              type: string
              description: プロキシの定型文 (上流の文章ではない)
            type:
              type: string
              description: エラーの種別 (invalid_request_error など)
            code:
              type: string
              description: 細かい理由コード (context_length_exceeded など)
            param:
              type: string
              description: 問題のあった入力項目 (messages[0].content など)
          required: [message]
          additionalProperties: false
      required: [error]
      additionalProperties: false
    DailyUsage:
      type: object
      required: [day, requests, errorRequests, inputTokens, outputTokens, costMicroUsd]
      properties:
        day:
          type: string
          format: date
          description: UTC の日 (YYYY-MM-DD)
        requests:
          type: integer
          description: その日の中継回数 (上流が失敗した呼び出しも含む)
        errorRequests:
          type: integer
          description: >-
            そのうち上流の HTTP ステータスが 400 以上だった回数。
            稼働率 (ダッシュボードが表示する成功率) の分子で、requests との対で意味を持つ。
            **分母と同じクエリで数える**ので requests を超えることはない
        inputTokens:
          type: integer
          description: 入力トークンの合計
        outputTokens:
          type: integer
          description: 出力トークンの合計
        costMicroUsd:
          type: string
          description: 料金の合計 (マイクロ USD の整数。浮動小数誤差を避けるため文字列で運ぶ)
    DailyUsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyUsage'
    GuardrailRule:
      type: object
      required: [id, tenantId, agentId, kind, threshold, windowMinutes, action, enabled, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        agentId:
          description: 対象エージェント。null はテナント全体へ掛かるルール
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/RuleKind'
        threshold:
          type: number
          description: |
            しきい値。cost はマイクロ USD の整数 (上限は 2^53-1 = 倍精度で正確に表せる範囲)、
            error_rate と quality は 0.0〜1.0 の比率
        windowMinutes:
          type: integer
          description: 集計窓の長さ (分)。**どの種別も窓を見る** — quality は窓の中の最新の評価実行だけを見るので、短すぎる窓にすると「その間に評価が無い」で一度も発火しない
        action:
          $ref: '#/components/schemas/RuleAction'
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    GuardrailRuleUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: |
            true で判定の対象に戻し、false で外す。**この 1 項目だけを受け付ける** —
            しきい値・種別・集計窓を変えられるようにすると、過去のインシデントが
            「どの条件で発火したか」を指さなくなる (条件を変えるときは無効にして作り直す)
    GuardrailRuleCreate:
      type: object
      additionalProperties: false
      required: [kind, threshold, windowMinutes, action]
      properties:
        agentId:
          description: 対象エージェント。省略・null はテナント全体へ掛かる
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/RuleKind'
        threshold:
          type: number
          minimum: 0
          description: |
            しきい値。種別ごとに上限が違う (cost は 9007199254740991、error_rate と quality は 1)。
            範囲外は 422。規則の正本は src/domain/guardrail/rule.ts の thresholdRangeFor
        windowMinutes:
          type: integer
          minimum: 1
          maximum: 10080
          description: 集計窓の長さ (分)。1 分〜7 日。無制限の窓は全件走査になるので許さない (§8 / §9)
        action:
          $ref: '#/components/schemas/RuleAction'
    GuardrailRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GuardrailRule'
        nextCursor:
          type: string
    GuardrailRunRequest:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId:
          type: string
          description: 判定対象のエージェント (自テナントのもの。見つからなければ 404)
    MaintenanceRunRequest:
      type: object
      additionalProperties: false
      properties:
        tenantCursor:
          type: string
          minLength: 1
          maxLength: 200
          description: 続きのテナント (前回応答の nextTenantCursor)。省略すると先頭から = 新しい一巡の開始
        agentCursor:
          type: string
          minLength: 1
          maxLength: 200
          description: 続きのエージェント (前回応答の nextAgentCursor)。省略するとそのテナントの先頭から
        agentBudget:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: この要求で判定するエージェント数の上限 (大きくするほど 1 要求が長くなる)
    MaintenanceRunResult:
      type: object
      required:
        [
          rateLimitHitsDeleted,
          rateLimitSweepComplete,
          tenantsVisited,
          agentsEvaluated,
          rulesEvaluated,
          fired,
          failed,
          passComplete,
          nextTenantCursor,
          nextAgentCursor,
        ]
      properties:
        rateLimitHitsDeleted:
          type: integer
          description: 消したレート制限の記録の件数 (回収は一巡の開始でだけ行うので、それ以外では 0)
        rateLimitSweepComplete:
          type: boolean
          description: >-
            回収しきったか。false ならまだ消せる行が残っており、そのときは**テナントを 1 件も
            歩かずに**戻る (passComplete も偽・カーソルも両方 null になるので、呼び出し側は
            同じ呼び方をもう一度するだけでよい)
        tenantsVisited:
          type: integer
          description: >-
            歩いたテナントの件数。**エージェントの予算とは別に数える** — 稼働中の
            エージェントを 1 件も持たないテナントは判定件数を増やさないので、
            エージェントの予算だけでは 1 要求の長さを縛れない
        agentsEvaluated:
          type: integer
          description: 判定を試みたエージェントの件数
        rulesEvaluated:
          type: integer
          description: 判定しきったルールの件数 (全エージェントぶんの合計)
        fired:
          type: integer
          description: 発火したルールの件数 (全エージェントぶんの合計)
        failed:
          type: integer
          description: >-
            判定できなかったルールの件数 + 判定そのものが失敗したエージェントの件数。
            0 でなければ掃きが取りこぼしている (詳細はサーバログ)
        passComplete:
          type: boolean
          description: >-
            やることが何も残っていないか。**カーソルの null では表せない** — 記録の回収を
            打ち切ったときはテナントを 1 件も歩かず「続きは先頭から」(カーソルは両方 null) で
            戻るので、null に 2 つの意味を持たせると回収の残りが永久に消える
        nextTenantCursor:
          type: [string, 'null']
          description: 続きのテナント (null は先頭のテナントから。passComplete が真なら意味を持たない)
        nextAgentCursor:
          type: [string, 'null']
          description: 続きのエージェント (null ならそのテナントの先頭から)
    GuardrailRunResult:
      type: object
      required: [evaluated, fired]
      properties:
        evaluated:
          type: integer
          description: 判定したルールの件数 (0 ならそのエージェントに掛かる有効なルールが無い)
        fired:
          type: array
          description: 発火したルール (しきい値を越えなかったものは含まない)
          items:
            $ref: '#/components/schemas/FiredGuardrail'
    FiredGuardrail:
      type: object
      required: [ruleId, kind, action, incidentId, suspended, created]
      properties:
        ruleId:
          type: string
        kind:
          $ref: '#/components/schemas/RuleKind'
        action:
          $ref: '#/components/schemas/RuleAction'
        incidentId:
          type: string
        suspended:
          type: boolean
          description: |
            このルールでエージェントを停止したか。action が stop でも、**手動停止中 (stopped) の
            エージェントは状態を塗り替えない**ので false になりうる (「誰が止めたか」を保つため)
        created:
          type: boolean
          description: |
            新しいインシデントを作ったか。**既に開いている同じルールのインシデントがあれば false**
            で、`incidentId` はその既存の行を指す。超過は解消するまで続くので、判定のたびに行を
            増やすと記録と通知が溢れる (notify のルールは停止しないので自己収束しない)。
            false のときは監査ログも通知も出さない (停止が実際に起きた場合を除く)
    Incident:
      type: object
      required: [id, tenantId, agentId, ruleId, status, summary, createdAt, resolvedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        agentId:
          type: string
        ruleId:
          type: string
        status:
          $ref: '#/components/schemas/IncidentStatus'
        summary:
          type: string
          description: 発火理由の 1 行 (実測値としきい値だけを含む。機微情報は入れない)
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time
    IncidentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        nextCursor:
          type: string
    AuditLog:
      type: object
      required: [id, tenantId, seq, actorId, action, targetType, targetId, payload, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        seq:
          type: string
          description: |
            テナントごとの連番 (1 始まり)。BigInt を JSON で安全に運ぶため文字列。
            連鎖の順序はこの値が決める (createdAt は同一ミリ秒で前後が定まらない)
        actorId:
          description: 操作したユーザー。ガードレールの自動発火など人が起点でない操作は null
          type: [string, 'null']
        action:
          type: string
          description: 操作名 (語彙は src/domain/audit/action.ts)
        targetType:
          type: string
        targetId:
          type: string
        payload:
          description: |
            操作の詳細 (平坦な辞書。機微情報は入れない)。ハッシュの計算に入るので、
            値の並べ替え以外の加工はしない
          type: [object, 'null']
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        nextCursor:
          type: string
    AuditChainVerification:
      type: object
      required: [ok, verified, reachedLimit]
      properties:
        ok:
          type: boolean
          description: 連鎖が無傷か
        verified:
          type: integer
          description: |
            検証できた行数。**壊れていた場合はその手前までの件数**で、読んだ件数ではない
            (読んだ件数を返すと「全部確かめた」と誤読される)
        reachedLimit:
          type: boolean
          description: |
            1 回に読む上限 (src/lib/constants.ts の AUDIT_CHAIN_VERIFY_MAX_ROWS) に達したか。
            true なら続きの行は検証していないので、nextFromSeq を fromSeq に渡して続きを検証する
        nextFromSeq:
          type: string
          description: |
            続きの区間を検証するために fromSeq へ渡す連番 (reachedLimit が true のときだけ。
            BigInt なので文字列)。これを渡さずに呼び直すと、同じ最古の区間を検証し続ける
        brokenSeq:
          type: string
          description: 最初に壊れた行の連番 (ok が false のときだけ。BigInt なので文字列)
        reason:
          type: string
          description: |
            壊れ方。hash_mismatch = 値の書き換え、prev_hash_mismatch = 行の差し込み・並べ替え、
            seq_not_sequential = 行の削除、payload_not_canonical = payload が平坦な辞書でない、
            tenant_mismatch = 別テナントの行が混ざった (取り出すクエリが壊れている)
          enum:
            [
              hash_mismatch,
              prev_hash_mismatch,
              seq_not_sequential,
              payload_not_canonical,
              tenant_mismatch,
            ]
    Billing:
      type: object
      required: [plan, limits, features]
      additionalProperties: false
      description: |-
        現在の契約プランと、そのプランの上限・機能の可否。正本は src/domain/plan.ts の
        PLAN_LIMITS で、ここはその形を契約として書いたもの
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        limits:
          type: object
          required: [maxAgents, proxyRateLimitPerMinute, maxEnabledGuardrailRules]
          additionalProperties: false
          properties:
            maxAgents:
              type: integer
              description: 登録できるエージェントの数 (超過は POST /agents が 409)
            proxyRateLimitPerMinute:
              type: integer
              description: 中継の共有の枠 (1 分あたり。超過は 429 + Retry-After)
            maxEnabledGuardrailRules:
              type: integer
              description: 同時に有効にできるガードレールのルール数 (超過は 409)
        features:
          type: object
          required: [auditChainVerify]
          additionalProperties: false
          description: |-
            プランで可否が決まる機能。使えない機能を呼ぶと 403 (権限不足とは別の文言)。
            項目は src/domain/plan.ts の PLAN_FEATURES から導く
          properties:
            auditChainVerify:
              type: boolean
              description: 監査ログのハッシュ連鎖の検証 (GET /audit-logs/verify) を使えるか
    BillingWebhookEvent:
      type: object
      required: [id, type, data]
      additionalProperties: true
      description: |-
        課金事業者 (Stripe) が送るイベント。**additionalProperties を閉じない** —
        事業者が項目を増やした日に全イベントが 422 になり、プランの反映が止まる。
        読むのは「どのイベントか (id / type)」「どの顧客か (customer)」「どのプランか
        (items.data[0].price.lookup_key)」だけで、金額・税・請求書は読まない
      properties:
        id:
          type: string
          maxLength: 255
          description: 事業者側のイベント ID (evt_...)。冪等性のキー
        type:
          type: string
          maxLength: 255
          description: イベント種別 (customer.subscription.created / updated / deleted を解釈する)
        data:
          type: object
          required: [object]
          properties:
            object:
              type: object
              description: イベントの対象 (サブスクリプション)
              properties:
                id:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: サブスクリプション ID (sub_...)
                customer:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: 顧客 ID (cus_...)。これでテナントを引く
                status:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: |-
                    契約の状態 (active / trialing / past_due / canceled / unpaid / paused /
                    incomplete / incomplete_expired)。**価格だけでプランは決まらない** —
                    active / trialing / past_due は価格のプランへ反映し、canceled / unpaid /
                    paused は無料プランへ落とし、incomplete / incomplete_expired と知らない
                    状態・未指定は何もしない (支払う前に有料の枠が付かないようにする)
                  example: active
                items:
                  type: object
                  nullable: true
                  description: 契約の明細 (**最初の 1 件だけを読む**。1 契約 1 プランの前提)
                  properties:
                    data:
                      type: array
                      nullable: true
                      items:
                        type: object
                        properties:
                          price:
                            type: object
                            nullable: true
                            properties:
                              lookup_key:
                                type: string
                                maxLength: 255
                                nullable: true
                                description: |-
                                  価格に付けた名前。プランとの対応は
                                  src/lib/billing/events.ts の BILLING_PRICE_LOOKUP_KEYS が持つ
                                  (agent-ops-free / -pro / -enterprise)
                                example: agent-ops-pro
    BillingWebhookResult:
      type: object
      required: [received, applied]
      additionalProperties: false
      properties:
        received:
          type: boolean
          description: 受信して記録したか (署名が通れば常に true)
        applied:
          type: boolean
          description: |-
            プランを反映したか。false になるのは「再送 (2 通目)」「顧客 ID に対応する
            テナントが無い」「知らない種別・知らない価格」「まだ有効でない契約 (incomplete)」
            「いまの契約とは別のサブスクリプションの解約 (配信順の入れ替わり)」のいずれか
    TenantPlanUpdate:
      type: object
      required: [plan]
      additionalProperties: false
      description: |-
        プランと課金連携の変更 (プラットフォーム管理者専用)。受信 Webhook は顧客 ID で
        **テナントを引く**だけで書かないので、連携を作るのはこの経路。テナント内の利用者は
        呼べない (課金の実体は事業者側にあるため)
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        billingCustomerId:
          type: string
          nullable: true
          maxLength: 100
          description: |-
            事業者側の顧客 ID (`cus_...`)。**省略すると据え置き**、`null` で連携を外す。
            事業者の画面で作った顧客を運用者が結び付けるための項目
          example: cus_123
        billingSubscriptionId:
          type: string
          nullable: true
          maxLength: 100
          description: |-
            事業者側のサブスクリプション ID (`sub_...`)。**省略すると据え置き**、`null` で連携を
            外す。通常は受信 Webhook が書くので触る必要は無いが、**顧客を付け替えたときの修復に
            要る** — 新しい契約が既に有効だと `created` / `updated` が届かず古い値が残り、以後の
            解約が「いまの契約とは別の解約」として捨てられる (受信は記録済みなので再送も来ない)
          example: sub_123
