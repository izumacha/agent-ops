# Agent Ops REST API の OpenAPI 定義 (正本)。
# `npm run gen` が src/generated/openapi.d.ts に TypeScript 型を生成し、ルートハンドラはその型を使う。
# Step1 で src/app/api/v1/* に実装済み。この定義と一致することを tests/api/*.test.ts で固定する (docs/adr/0003-openapi-first.md)。
# 認証は Bearer (docs/adr/0005-bearer-token-auth.md): ユーザートークン (aop_u_...) か、テナント作成・列挙専用の
# プラットフォーム管理者トークン (環境変数 PLATFORM_ADMIN_TOKEN)。
openapi: 3.1.0
info:
  title: Agent Ops API
  version: 0.1.0
  description: AI エージェントの登録・権限・コスト・品質・停止を管理する API。
servers:
  - url: /api/v1
    description: 同一オリジン (Next.js Route Handlers)
tags:
  - name: health
    description: 生存確認
  - name: tenants
    description: テナント (Step1)
  - name: users
    description: ユーザー・役割・ログイントークン (Step1)
  - name: agents
    description: エージェント台帳 (Step1)
  - name: api-keys
    description: API キー発行 (Step1)
  - name: proxy
    description: LLM 呼び出しの中継とコスト計測 (Step2)
  - name: usage
    description: 利用量・コストの集計 (Step2)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: アプリと DB の生存確認
      security: []
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: DB に到達できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: テナント一覧 (プラットフォーム管理者のみ)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [tenants]
      operationId: createTenant
      summary: テナント作成 (プラットフォーム管理者のみ)。最初の admin ユーザーとそのログイントークンを同時に作る (UC-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: 作成した (adminToken.secret はこの応答でのみ返す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getTenant
      summary: 自テナントの取得 (view 権限。他テナントの id は 404)
      responses:
        '200':
          description: テナント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me:
    get:
      tags: [users]
      operationId: getMe
      summary: 認証中のユーザーと所属テナント (テナントのユーザーのみ)
      responses:
        '200':
          description: 自分の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 自テナントのユーザー一覧
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [users]
      operationId: createUser
      summary: ユーザー招待 (admin ロール限定)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [users]
      operationId: disableUser
      summary: ユーザー無効化 (admin ロール限定)。監査ログの操作者は削除できないため、削除の代わりに無効化する。自分自身・最後の有効な admin は 409
      responses:
        '200':
          description: 無効化後のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      operationId: updateUserRole
      summary: 役割変更 (admin ロール限定)。最後の有効な admin を降格する変更と、無効化済みユーザーへの変更は 409
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: 更新後のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/{userId}/tokens:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: listUserTokens
      summary: ユーザーのログイントークン一覧 (admin ロール限定。平文は含まない)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [users]
      operationId: createUserToken
      summary: ログイントークン発行 (admin ロール限定。平文はこの応答でのみ返す。無効化されたユーザーには 409)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTokenCreate'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenIssued'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/{userId}/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [users]
      operationId: revokeUserToken
      summary: ログイントークン失効 (admin ロール限定)
      responses:
        '204':
          description: 失効した
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: エージェント一覧 (view 権限)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AgentStatus'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [agents]
      operationId: createAgent
      summary: エージェント登録 (execute 権限)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      summary: エージェント取得 (view 権限)
      responses:
        '200':
          description: エージェント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: エージェント更新 (execute 権限)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: 更新後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: エージェント削除 (stop 権限)。利用・評価・インシデントの履歴があるエージェントは削除できない (409。stop を使う)
      responses:
        '204':
          description: 削除した
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents/{agentId}/stop:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: stopAgent
      summary: エージェント停止 (stop 権限)
      responses:
        '200':
          description: 停止後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /agents/{agentId}/resume:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: resumeAgent
      summary: エージェント復帰 (stop 権限)
      responses:
        '200':
          description: 復帰後
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: API キー一覧 (view 権限。平文は含まない)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: API キー発行 (execute 権限。平文はこの応答でのみ返す。agentId が自テナントに無ければ 422)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssued'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api-keys/{apiKeyId}:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: API キー失効 (stop 権限。失効済みのキーへの再実行も 204)
      responses:
        '204':
          description: 失効した
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /proxy/anthropic/messages:
    post:
      tags: [proxy]
      operationId: proxyAnthropicMessages
      summary: Anthropic Messages API への中継 (API キー認証。トークン・料金を UsageEvent に記録する)
      description: |
        本文をそのまま Anthropic の Messages API へ中継し、応答のトークン数から料金を計算して記録する。
        **認証は API キー (aop_k_...) だけ**で、ユーザートークンでは 401 になる (docs/adr/0007-cost-proxy.md)。
        エージェントに紐づいていないキー・停止中のエージェントのキーは 403。
        料金表 (src/domain/pricing/vendor-prices.json) に無いモデルは計測できないので中継せず 422。
        ストリーミング (stream: true) は Step2 の範囲外で 422。

        上流の応答の扱い: 2xx はそのまま返す。**4xx はステータスだけを返し、本文は機械可読な項目
        (`error.type` / `error.code` / `error.param` と最上位の `type`) に絞る** —
        自由記述の `message` には上流アカウントの残高・組織名・契約ティアが載るため
        (ステータス番号では「送り主の本文が悪い 400」と選り分けられない)。
        401 / 403 は 502 に写し、429 は 429 のまま定型文へ差し替えて Retry-After
        (整数の秒数のときだけ) を中継する。5xx は 502。
        **上流の本文が JSON として読めない場合 (HTML のエラーページ、本文を持てない 204 / 304、
        上限を超える大きさ) も 502** で、本文は返さない。

        **本文は受け取ったバイト列をそのまま流さず、検証済みの値を JSON へ組み立て直して送る**。
        そのため JSON の正規化が起きる: 2^53 を超える整数は丸められ、1e400 は null、-0 は 0 になる。
        巨大な整数を seed などに渡す場合はこの点に注意する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
      responses:
        '200':
          description: 上流の応答 (本文の形はベンダーの仕様に従うためそのまま返す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ProxyRelayedError'
        '404':
          $ref: '#/components/responses/ProxyRelayedError'
        '413':
          $ref: '#/components/responses/ProxyRelayedError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /proxy/openai/chat/completions:
    post:
      tags: [proxy]
      operationId: proxyOpenAiChatCompletions
      summary: OpenAI Chat Completions API への中継 (API キー認証。トークン・料金を UsageEvent に記録する)
      description: |
        Anthropic 向けの中継と同じ規律 (認証・未対応モデル・ストリーミング・上流エラーの扱い・
        本文の JSON 正規化) で、OpenAI の Chat Completions API へ中継する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequest'
      responses:
        '200':
          description: 上流の応答 (本文の形はベンダーの仕様に従うためそのまま返す)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/ProxyRelayedError'
        '404':
          $ref: '#/components/responses/ProxyRelayedError'
        '413':
          $ref: '#/components/responses/ProxyRelayedError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /usage/daily:
    get:
      tags: [usage]
      operationId: getDailyUsage
      summary: 日次のコスト集計 (view 権限)
      description: |
        期間内の UsageEvent を **UTC の日ごと**に集計する。期間 (from / to) は必須で、どちらも含む。
        日の境目は配備先のタイムゾーンに依存しない (docs/adr/0008-usage-pricing-and-aggregation.md)。
      parameters:
        - name: from
          in: query
          required: true
          description: 集計の開始日 (YYYY-MM-DD、含む)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 集計の終了日 (YYYY-MM-DD、含む)
          schema:
            type: string
            format: date
        - name: agentId
          in: query
          description: エージェントで絞る (省略時はテナント全体)
          schema:
            type: string
      responses:
        '200':
          description: 日ごとの集計 (イベントが無い日は含まれない)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyUsageList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: ユーザーのログイントークン (aop_u_...)、またはテナント作成・列挙専用のプラットフォーム管理者トークン (環境変数 PLATFORM_ADMIN_TOKEN)。API キー (aop_k_...) は Step2 のプロキシ専用でこの API では使えない
  parameters:
    Limit:
      name: limit
      in: query
      description: 取得件数 (既定 50、最大 200。§8 一覧は必ず上限を持つ)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: ページネーションカーソル (前回応答の nextCursor)
      schema:
        type: string
        minLength: 1
        maxLength: 200
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: 認証情報が無い、または無効 (失効・期限切れ・ユーザー無効化を含む。理由は区別しない)
      headers:
        WWW-Authenticate:
          description: 'Bearer realm="agent-ops" (無し) / Bearer realm="agent-ops", error="invalid_token" (無効)'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: リクエスト本文を JSON として解釈できない (本文が最後まで届かなかった場合を含む)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: リクエスト本文が上限 (src/lib/constants.ts の JSON_BODY_MAX_BYTES) を超えている
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type が application/json でない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 権限がない (RBAC 違反)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 見つからない (他テナントの資源も 404 で隠す)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: サーバー内部のエラー (応答は内部詳細を含まない。詳細はサーバログに残る)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProxyRelayedError:
      description: |
        プロキシ自身が要求を拒否した (本文が JSON でない・上限超過など) か、上流が拒否したかの
        どちらか。前者は API 共通のエラー形 ({status, message})、後者は上流の形を保った
        RelayedUpstreamError で、**本文は機械可読な項目だけに絞ってある**
        (自由記述には上流アカウントの残高・組織名・契約ティアが載るため)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/RelayedUpstreamError'
    TooManyRequests:
      description: |
        上流の LLM プロバイダが混雑を返した。本文は定型文に差し替える (上流の本文には組織名や
        クォータの状況が載るため) が、上流が Retry-After を返した場合はその値だけ中継する
      headers:
        Retry-After:
          description: 再試行までの待ち時間 (上流が指示した場合のみ)
          required: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: 上流の LLM プロバイダの呼び出しに失敗した
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: このプロバイダへの中継が設定されていない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GatewayTimeout:
      description: 上流の LLM プロバイダが時間内に応答しなかった
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 現在の状態では実行できない (履歴を持つ資源の削除など)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: 入力検証エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          description: HTTP ステータス
        message:
          type: string
          description: 利用者向けの日本語メッセージ (内部詳細は含めない)
        issues:
          type: array
          description: 入力検証の詳細 (422 のとき)
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                description: "誤りのあるフィールド (入れ子は '.' 区切り)。本文全体に対する誤り、たとえば変更する項目が 1 つも無い場合は空文字"
              message:
                type: string
    Health:
      type: object
      required: [ok, db]
      properties:
        ok:
          type: boolean
        db:
          type: string
          enum: [up, down]
    Plan:
      type: string
      enum: [free, pro, enterprise]
    Role:
      type: string
      enum: [viewer, operator, admin]
    AgentStatus:
      type: string
      enum: [active, stopped, suspended]
    Provider:
      type: string
      enum: [anthropic, openai]
    Tenant:
      type: object
      required: [id, name, plan, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        plan:
          $ref: '#/components/schemas/Plan'
        createdAt:
          type: string
          format: date-time
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name, adminEmail, adminName]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        adminEmail:
          type: string
          format: email
          maxLength: 254
          description: 最初の admin ユーザーのメール
        adminName:
          type: string
          minLength: 1
          maxLength: 100
          description: 最初の admin ユーザーの表示名
    TenantCreated:
      type: object
      required: [tenant, admin, adminToken]
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        admin:
          $ref: '#/components/schemas/User'
        adminToken:
          $ref: '#/components/schemas/UserTokenIssued'
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        nextCursor:
          type: string
    User:
      type: object
      required: [id, tenantId, email, name, role, disabledAt, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        disabledAt:
          type: [string, 'null']
          format: date-time
          description: 無効化日時 (有効なら null)。無効化されたユーザーのトークンは 401 になる
        createdAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [user, tenant]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          $ref: '#/components/schemas/Tenant'
    UserToken:
      type: object
      required: [id, userId, prefix, name, createdAt, expiresAt, revokedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        prefix:
          type: string
          description: 先頭数文字 (特定用。秘密ではない)
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 有効期限 (既定 90 日、最長 365 日。無期限は作れない)
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: 失効日時 (有効なら null)
    UserTokenCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: '用途メモ (例: CLI、CI)'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    UserTokenIssued:
      allOf:
        - $ref: '#/components/schemas/UserToken'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 平文トークン。発行時の応答でのみ返し、以後は取得できない
    UserTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserToken'
        nextCursor:
          type: string
    UserCreate:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 小文字に正規化して保存する (テナント内の一意性と検索は大文字小文字を区別しない)
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
    Agent:
      type: object
      required:
        [id, tenantId, name, description, provider, model, status, budgetMicroUsd, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        provider:
          $ref: '#/components/schemas/Provider'
        model:
          type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
        budgetMicroUsd:
          type: [string, 'null']
          description: 月次予算 (マイクロ USD)。BigInt を JSON で安全に運ぶため文字列。未設定は null
        createdAt:
          type: string
          format: date-time
    AgentCreate:
      type: object
      additionalProperties: false
      required: [name, provider, model]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        provider:
          $ref: '#/components/schemas/Provider'
        model:
          type: string
          minLength: 1
          maxLength: 100
        budgetMicroUsd:
          type: string
          pattern: '^[0-9]+$'
          maxLength: 19
          description: マイクロ USD の整数 (PostgreSQL BIGINT の範囲。19 桁まで。上限 9223372036854775807 を超える値は JSON Schema で表せないため 422 を返す)
    AgentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: 省略したプロパティは変更しない。null を送ると未設定に戻す (description / budgetMicroUsd)。1 つも指定が無い本文は 422
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          minLength: 1
          maxLength: 1000
        model:
          type: string
          minLength: 1
          maxLength: 100
        budgetMicroUsd:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          maxLength: 19
          description: マイクロ USD の整数 (PostgreSQL BIGINT の範囲。19 桁まで。上限 9223372036854775807 を超える値は JSON Schema で表せないため 422 を返す)
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        nextCursor:
          type: string
    ApiKey:
      type: object
      required: [id, tenantId, agentId, prefix, name, createdAt, revokedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        agentId:
          type: [string, 'null']
          description: 紐づくエージェント (テナント共通キーなら null)
        prefix:
          type: string
          description: 先頭数文字 (特定用。秘密ではない)
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: 失効日時 (有効なら null)
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        agentId:
          description: 紐づけるエージェントの id (資源 id の形。形が違う値は 422)
          type: string
          minLength: 1
          maxLength: 64
    ApiKeyIssued:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: 平文キー。発行時の応答でのみ返し、以後は取得できない
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        nextCursor:
          type: string
    ProxyRequest:
      type: object
      description: |
        中継する本文。**ベンダーのペイロードそのもの**なので未知キーを許す (additionalProperties: true)。
        計測に必要な model だけを必須とし、未対応の stream: true を拒む。この 1 件だけ
        「未知キーを閉じる」原則の例外で、理由は tests/openapi.test.ts の除外表と ADR-0007 にある。
      additionalProperties: true
      required: [model]
      properties:
        model:
          type: string
          maxLength: 100
          description: 使用するモデル名。料金表に無いモデルは中継せず 422
        stream:
          type: boolean
          enum: [false]
          description: ストリーミングは Step2 の範囲外。省略するか false を指定する
    ProxyResponse:
      type: object
      description: 上流の応答をそのまま返す (項目はベンダーの仕様に従う)
      additionalProperties: true
    RelayedUpstreamError:
      type: object
      description: |
        プロキシが中継する上流のエラー本文。ベンダーの形は保つが、通すのは機械可読な識別子だけで、
        自由記述の message はプロキシの定型文に置き換わる (docs/adr/0007-cost-proxy.md 決定 7)。
      properties:
        type:
          type: string
          description: 上流が最上位に置いた種別 (Anthropic は 'error')
        error:
          type: object
          properties:
            message:
              type: string
              description: プロキシの定型文 (上流の文章ではない)
            type:
              type: string
              description: エラーの種別 (invalid_request_error など)
            code:
              type: string
              description: 細かい理由コード (context_length_exceeded など)
            param:
              type: string
              description: 問題のあった入力項目 (messages[0].content など)
          required: [message]
          additionalProperties: false
      required: [error]
      additionalProperties: false
    DailyUsage:
      type: object
      required: [day, requests, inputTokens, outputTokens, costMicroUsd]
      properties:
        day:
          type: string
          format: date
          description: UTC の日 (YYYY-MM-DD)
        requests:
          type: integer
          description: その日の中継回数 (上流が失敗した呼び出しも含む)
        inputTokens:
          type: integer
          description: 入力トークンの合計
        outputTokens:
          type: integer
          description: 出力トークンの合計
        costMicroUsd:
          type: string
          description: 料金の合計 (マイクロ USD の整数。浮動小数誤差を避けるため文字列で運ぶ)
    DailyUsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyUsage'
